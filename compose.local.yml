name: forgeflow-local
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: forgeflow
      POSTGRES_PASSWORD: local-demo-password
      POSTGRES_DB: forgeflow
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["local_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeflow -d forgeflow"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["local_redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  local_pgdata:
  local_redisdata:
